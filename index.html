<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>금호 헤리티지 보고</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#141b3d;--bg2:#0f1531;--panel:#1d2652;--line:#33407a;--ink:#f3f1ec;--mute:#a9b0cc;--ember:#f07f2f;--ember2:#ffc78a;
--serif:"Noto Serif KR",Georgia,serif;--sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box} img{max-width:100%} [hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--sans);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 16px}
.wrap{max-width:none;margin:0}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;padding-block:22px 14px;border-bottom:1px solid var(--line)}
.kick{font-size:12px;letter-spacing:.18em;color:var(--ember);font-weight:700}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(24px,3.4vw,34px);margin:2px 0 0}
.sub{color:var(--mute);font-size:14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px}
.bar{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:22px}
.toprow{display:contents}
.ttl{grid-column:1;grid-row:1/3;align-self:stretch;display:flex;align-items:center;font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.25;margin:0;padding-right:22px;border-right:1px solid var(--line);white-space:nowrap}
.bar .tabs{grid-column:2;grid-row:1}.bar .subrow{grid-column:2;grid-row:2}
@media (max-width:700px){.bar{display:block}.ttl{border-right:0;padding:0 0 8px}}
.tabs,.subtabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{font:inherit;font-weight:500;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 20px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ember);border-color:var(--ember);color:#1a1206;font-weight:700}
.subtabs{margin-top:10px;border-bottom:1px solid var(--line)}
.subtabs button{font:inherit;font-size:14px;color:var(--mute);background:none;border:0;border-bottom:3px solid transparent;padding:6px 21px 8px;cursor:pointer;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ember);font-weight:700}
button:focus-visible,a:focus-visible,.stage:focus-visible{outline:2px solid var(--ember2);outline-offset:2px}
.subrow{display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);margin-top:10px}
.subrow .subtabs{border-bottom:0;margin-top:0;flex:1 1 auto;min-width:0}
.ctl{display:flex;align-items:center;gap:8px;padding-bottom:6px;flex:0 0 auto}
.btn.sm{padding:5px 12px;font-size:13px}
.subtabs .newwin{align-self:center;margin:0 0 4px 4px;text-decoration:none;white-space:nowrap}
.ptitle{color:var(--mute);font-size:13px;max-width:44ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle small{color:var(--ember);font-weight:700}
.ptitle b{color:var(--ink);font-weight:500}
@media (max-width:700px){.subrow{flex-wrap:wrap}.ptitle{display:none}}
.pane{padding-top:10px}
h2{font-family:var(--serif);font-size:22px;margin:0 0 4px}
.lead{color:var(--mute);margin:0 0 14px;max-width:70ch}
.doc{display:grid;gap:16px}
#bovImg{cursor:pointer}
.doc img{display:block;width:auto;max-width:100%;max-height:calc(100vh - 118px);height:auto;margin:0 auto;border-radius:4px;background:#fff}
.doc.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr))}
.next{margin-top:10px}
.btn{font:inherit;font-weight:700;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 16px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--ember);border-color:var(--ember);color:#1a1206}
.btn:disabled{opacity:.35;cursor:default}
.video{background:#000;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.video video{display:block;width:100%;height:auto;aspect-ratio:1920/1358;max-height:calc(100vh - 230px);background:#000}
.chapters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chapters button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer}
.chapters button span{color:var(--ember);font-variant-numeric:tabular-nums;margin-right:6px}
.secs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.secs button{font:inherit;font-size:12.5px;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer}
.secs button.on{color:var(--ink);border-color:var(--ember);background:rgba(240,127,47,.12)}
.stagebox{display:flex;justify-content:center}
.stage{position:relative;perspective:2600px;width:min(100%,calc((100vh - 200px)*1.445));aspect-ratio:1400/969;background:var(--bg2);user-select:none;cursor:pointer;overflow:hidden;border-radius:3px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.45,.05,.25,1)}
.leaf img{backface-visibility:hidden}
.leaf .back{transform:rotateY(180deg)}
.leaf.turn{transform:rotateY(-180deg)}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.3),transparent 35%);opacity:0;transition:opacity .7s}
.stage.flipping .shade{opacity:1}
.hint{position:absolute;bottom:10px;right:12px;font-size:12px;color:#fff;background:rgba(0,0,0,.45);padding:3px 10px;border-radius:99px;pointer-events:none}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.pinfo{min-width:0} .pinfo b{display:block;font-size:17px} .pinfo small{color:var(--ember);font-weight:700;letter-spacing:.04em}
.count{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px}
.bookrow{display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:14px;align-items:start}
.tcol{position:relative;align-self:stretch}
.thumbs{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overflow-x:hidden;padding-right:4px;scrollbar-width:thin}
@media (max-width:700px){.bookrow{grid-template-columns:1fr}.tcol{display:none}}
.thumb{flex:0 0 auto;width:100%;border:2px solid transparent;border-radius:3px;padding:0;background:none;cursor:pointer;opacity:.55}
.thumb img{display:block;width:100%;height:auto} .thumb.on{border-color:var(--ember);opacity:1}
.fview{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.fview{grid-template-columns:1fr}}
.fbig{position:relative;background:#000;border:1px solid var(--line);border-radius:6px;overflow:hidden;aspect-ratio:16/10}
.fbig img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .35s}
.fcap{position:absolute;left:0;bottom:0;padding:6px 14px;background:rgba(15,21,49,.85);color:var(--ink);font-weight:700;border-top-right-radius:6px}
.flist{display:grid;gap:8px}
.fitem{font:inherit;text-align:left;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:4px;padding:10px 14px;cursor:pointer}
.fitem b{display:block;font-size:16px}.fitem span{color:var(--mute);font-size:13px}
.fitem em{font-style:normal;color:var(--ember);margin-right:8px;font-variant-numeric:tabular-nums}
.fitem.on{border-left-color:var(--ember);background:#26306a}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.fcard{margin:0;background:var(--panel);border-radius:6px;overflow:hidden}
.fcard img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.fcard figcaption{padding:10px 14px 14px} .fcard b{display:block;font-size:17px} .fcard span{color:var(--mute);font-size:14px}
.frame{position:relative;width:100%;height:calc(100vh - 128px);min-height:480px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;color:var(--mute);font-size:13px}
.row code{color:var(--ink);background:var(--bg2);border:1px solid var(--line);padding:3px 8px;border-radius:3px;word-break:break-all}
@media (prefers-reduced-motion:reduce){.leaf{transition:none}}
</style>
</head>

stage.onclick=e=>{const r=stage.getBoundingClientRect();(e.clientX-r.left<r.width/3)?go(cur-1):go(cur+1)};
stage.onkeydown=e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1)}};
let sx=null;stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40){dx<0?go(cur+1):go(cur-1);e.preventDefault()}sx=null});
document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);paint();

document.querySelectorAll('.fitem').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,img=document.getElementById('fbig');document.querySelectorAll('.fitem').forEach(x=>x.classList.toggle('on',x===b));img.style.opacity=0;setTimeout(()=>{img.src=FEAT[i].src;img.alt=FEAT[i].t+' 화면';document.getElementById('fcap').textContent=FEAT[i].t;img.style.opacity=1},180)});
const BOV=[['report/r4.jpg','목적 · 목차']];let bo=0;
function bov(){document.getElementById('bovImg').src=BOV[bo][0];document.getElementById('bovC').textContent=(bo+1)+' / '+BOV.length;document.getElementById('bovP').disabled=bo===0;document.getElementById('bovN').disabled=bo===BOV.length-1}
document.getElementById('bovP').onclick=()=>{if(bo>0){bo--;bov()}};document.getElementById('bovN').onclick=()=>{if(bo<BOV.length-1){bo++;bov()}};document.getElementById('bovImg').onclick=()=>{if(bo<BOV.length-1){bo++;bov()}};bov();
